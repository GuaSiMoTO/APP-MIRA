<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'" />
    <title>Grabando</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #bar {
        position: absolute;
        inset: 6px;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0 6px 0 4px;
        border-radius: 12px;
        background: rgba(30, 30, 35, 0.96);
        box-shadow: var(--shadow);
      }
      #grip {
        -webkit-app-region: drag;
        align-self: stretch;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px;
        flex: 1;
        cursor: move;
      }
      #led {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 4px rgba(255, 76, 96, 0.2);
        animation: blink 1.2s infinite;
      }
      /* Guardando: los botones ya no hacen nada */
      #bar.saving button {
        opacity: 0.4;
        pointer-events: none;
      }
      #bar.paused #led,
      #bar.saving #led,
      #bar.starting #led {
        animation: none;
        background: #f5a524;
        box-shadow: 0 0 0 4px rgba(245, 165, 36, 0.2);
      }
      @keyframes blink {
        50% {
          opacity: 0.35;
        }
      }
      #time {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 14px;
      }
      #audio {
        color: var(--muted);
        display: flex;
        gap: 2px;
      }
      #audio svg {
        width: 15px;
        height: 15px;
      }
      #stop {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <div id="bar" class="starting">
      <div id="grip"><span id="led"></span><span id="time">00:00</span><span id="audio"></span></div>
      <button class="icon-btn" id="pause" title="Pausar"></button>
      <button class="icon-btn" id="discard" title="Descartar grabación"></button>
      <button class="icon-btn" id="stop" title="Detener y guardar"></button>
    </div>
    <script type="module" src="./recorder/main.ts"></script>
  </body>
</html>
