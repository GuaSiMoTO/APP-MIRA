<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; media-src capturas:; style-src 'self' 'unsafe-inline'" />
    <title>Vista previa</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #card {
        position: absolute;
        inset: 8px;
        border-radius: 14px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        opacity: 0;
        transform: translateY(12px) scale(0.97);
        transition: opacity 0.18s, transform 0.18s;
      }
      #card.in {
        opacity: 1;
        transform: none;
      }
      #media {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: repeating-conic-gradient(#2a2a30 0 25%, #232328 0 50%) 0 0 / 16px 16px;
      }
      #media img,
      #media video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        display: block;
        -webkit-user-drag: none;
      }
      #actions {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(15, 15, 18, 0.55);
        opacity: 0;
        transition: opacity 0.15s;
        cursor: grab;
      }
      #card:hover #actions {
        opacity: 1;
      }
      .center {
        display: flex;
        flex-direction: column;
        gap: 7px;
        min-width: 130px;
      }
      .center .btn {
        height: 34px;
        background: rgba(255, 255, 255, 0.92);
        color: #111;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        font-weight: 600;
      }
      .center .btn:hover {
        background: #fff;
      }
      .corner {
        position: absolute;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(20, 20, 24, 0.85);
        display: grid;
        place-items: center;
      }
      .corner svg {
        width: 15px;
        height: 15px;
      }
      .corner:hover {
        background: #000;
      }
      #close {
        top: 8px;
        left: 8px;
      }
      #folder {
        top: 8px;
        right: 8px;
      }
      #status {
        position: absolute;
        left: 8px;
        right: 8px;
        bottom: 8px;
        padding: 4px 8px;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.85);
        font-size: 11.5px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #info {
        position: absolute;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        padding: 2px 8px;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.85);
        font-size: 11px;
        color: #d4d4d8;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #card:hover #info {
        opacity: 1;
      }
      #card:hover #status:not(.show) + #info {
        opacity: 1;
      }
      #status.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div id="media"></div>
      <div id="actions" draggable="true" title="Doble clic para abrir · arrastra para compartir">
        <button class="corner" id="close" title="Cerrar"></button>
        <button class="corner" id="folder" title="Abrir carpeta de capturas"></button>
        <div class="center"></div>
      </div>
      <div id="status"></div>
      <div id="info"></div>
    </div>
    <script type="module" src="./preview/main.ts"></script>
  </body>
</html>
