<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Texto reconocido</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #card {
        position: absolute;
        inset: 8px;
        display: flex;
        flex-direction: column;
        border-radius: 14px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        opacity: 0;
        transform: translateY(12px) scale(0.97);
        transition: opacity 0.18s, transform 0.18s;
      }
      #card.in {
        opacity: 1;
        transform: none;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 8px 6px 14px;
      }
      header svg {
        width: 18px;
        height: 18px;
        color: #9fb3ff;
      }
      #title {
        flex: 1;
        font-weight: 600;
      }
      #status {
        padding: 0 14px 6px;
        font-size: 12px;
        color: var(--muted);
        min-height: 18px;
      }
      #status.ok {
        color: #6ee7a8;
      }
      #status.err {
        color: #ffb4bd;
      }
      textarea {
        flex: 1;
        margin: 0 10px;
        padding: 10px;
        border: 0;
        border-radius: 8px;
        resize: none;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 'Segoe UI', system-ui, sans-serif;
        outline: none;
        box-shadow: inset 0 0 0 1px var(--line);
        user-select: text;
      }
      textarea:focus {
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 10px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        margin: auto;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #qr {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 10px 8px;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--accent-soft);
      }
      .qr-label {
        font-size: 11px;
        font-weight: 600;
        color: #b9c8ff;
        white-space: nowrap;
      }
      #qr-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        user-select: text;
      }
      .btn.small {
        height: 26px;
        padding: 0 10px;
        font-size: 12px;
      }
      #loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <header>
        <span id="ico"></span>
        <span id="title">Texto de la captura</span>
        <button class="icon-btn" id="close" title="Cerrar (Esc)"></button>
      </header>
      <div id="status"></div>
      <div id="loading"><div class="spinner"></div>Reconociendo texto…</div>
      <div id="qr" hidden>
        <span class="qr-label">Código QR</span>
        <span id="qr-text"></span>
        <button class="btn small" id="qr-copy">Copiar</button>
        <button class="btn small primary" id="qr-open" hidden>Abrir enlace</button>
      </div>
      <textarea id="text" spellcheck="false" hidden></textarea>
      <footer>
        <button class="btn" id="close2">Cerrar</button>
        <button class="btn primary" id="copy">Copiar</button>
      </footer>
    </div>
    <script type="module" src="./ocr/main.ts"></script>
  </body>
</html>
