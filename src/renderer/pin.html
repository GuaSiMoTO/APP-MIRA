<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'" />
    <title>Captura anclada</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
        cursor: grab;
      }
      body.dragging {
        cursor: grabbing;
      }
      img {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
        -webkit-user-drag: none;
        pointer-events: none;
      }
      #frame {
        position: fixed;
        inset: 0;
        box-shadow: inset 0 0 0 1px rgba(91, 124, 250, 0.9);
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      #tools {
        position: fixed;
        top: 6px;
        right: 6px;
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      body:hover #frame,
      body:hover #tools {
        opacity: 1;
      }
      #tools button {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(20, 20, 24, 0.85);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
        cursor: pointer;
      }
      #tools button:hover {
        background: #000;
      }
      #tools #close:hover {
        background: var(--danger);
      }
      #tools svg {
        width: 14px;
        height: 14px;
      }
      #badge {
        position: fixed;
        left: 50%;
        bottom: 8px;
        transform: translateX(-50%);
        padding: 3px 8px;
        border-radius: 6px;
        background: rgba(20, 20, 24, 0.85);
        font-size: 11.5px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }
      #badge.show {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <img id="img" alt="" />
    <div id="frame"></div>
    <div id="tools">
      <button id="copy" title="Copiar"></button>
      <button id="edit" title="Editar (doble clic)"></button>
      <button id="close" title="Cerrar (Esc)"></button>
    </div>
    <div id="badge"></div>
    <script type="module" src="./pin/main.ts"></script>
  </body>
</html>
