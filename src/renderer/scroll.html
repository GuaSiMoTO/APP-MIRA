<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'" />
    <title>Captura con desplazamiento</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #bar {
        position: absolute;
        inset: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 6px 0 4px;
        border-radius: 12px;
        background: rgba(30, 30, 35, 0.96);
        box-shadow: var(--shadow);
      }
      #grip {
        -webkit-app-region: drag;
        align-self: stretch;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 8px;
        flex: 1;
        min-width: 0;
        cursor: move;
      }
      #ico svg {
        width: 18px;
        height: 18px;
        color: #9fb3ff;
        display: block;
      }
      #info {
        display: flex;
        flex-direction: column;
        line-height: 1.2;
        min-width: 0;
      }
      #status {
        font-weight: 600;
        white-space: nowrap;
      }
      #sub {
        font-size: 11.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn {
        height: 30px;
        padding: 0 10px;
      }
      #done {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #done svg {
        width: 16px;
        height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="grip">
        <span id="ico"></span>
        <div id="info"><span id="status">Preparando…</span><span id="sub">Se desplaza sola · no toques el ratón</span></div>
      </div>
      <button class="btn" id="mode" title="Alterna entre desplazamiento automático y manual (con tu rueda)">Pausar auto</button>
      <button class="btn primary" id="done" title="Terminar y unir"></button>
      <button class="icon-btn" id="cancel" title="Cancelar (Esc)"></button>
    </div>
    <script type="module" src="./scroll/main.ts"></script>
  </body>
</html>
