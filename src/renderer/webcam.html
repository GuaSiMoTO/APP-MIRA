<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' blob: mediastream:; style-src 'self' 'unsafe-inline'" />
    <title>Cámara</title>
    <link rel="stylesheet" href="./shared/theme.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      #bubble {
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        overflow: hidden;
        background: #111;
        box-shadow: 0 0 0 3px #fff, 0 6px 16px rgba(0, 0, 0, 0.45);
        -webkit-app-region: drag;
        cursor: move;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1); /* efecto espejo, como al mirarse */
      }
      #msg {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 20px;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      #sizes {
        position: absolute;
        left: 50%;
        bottom: 12%;
        transform: translateX(-50%);
        display: flex;
        gap: 3px;
        padding: 3px;
        border-radius: 8px;
        background: rgba(20, 20, 24, 0.85);
        opacity: 0;
        transition: opacity 0.15s;
        -webkit-app-region: no-drag;
      }
      body:hover #sizes {
        opacity: 1;
      }
      #sizes button {
        width: 24px;
        height: 22px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 600;
      }
      #sizes button:hover {
        background: rgba(255, 255, 255, 0.15);
      }
    </style>
  </head>
  <body>
    <div id="bubble">
      <video id="video" autoplay muted playsinline></video>
      <div id="msg" hidden></div>
    </div>
    <div id="sizes" title="Tamaño de la cámara">
      <button data-size="s">S</button><button data-size="m">M</button><button data-size="l">L</button>
    </div>
    <script type="module" src="./webcam/main.ts"></script>
  </body>
</html>
